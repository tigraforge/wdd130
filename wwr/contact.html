<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Nile River Explorers</title>
    <meta name="description"
      content="Contact Nile River Explorers for rafting reservations, trip information, questions, and adventure planning.">
    <meta name="author" content="Mary Akintade">
    <link rel="stylesheet" href="./styles/rafting.css">

</head>

<body>

    <header>
        <img src="images/z-excitingexpedition.jpg" alt="Rafting Company Logo">


        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <>

        <section class="contact-info">
            <h1>Contact Nile River Explorers</h1>

            <div class="company-details">
                <p><strong>Address:</strong> 123 Nile River Road, Jinja, Uganda</p>
                <p><strong>Phone:</strong> +256 700 123 456</p>
                <p><strong>Email:</strong> info@nileriverexplorers.com</p>
            </div>
        </section>

        <section class="contact-grid">

            <div class="map">
                <iframe src="https://www.google.com/maps?q=Jinja,Uganda&output=embed"
                  allowfullscreen="" loading="lazy">
                </iframe>
            </div>

            <div class="contact-form">
                <form>

                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>

                    <p>Message Purpose</p>

                    <label>
                        <input type="radio" name="purpose" value="general" checked>
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>

                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5"></textarea>

                    <label class="checkbox">
                        <input type="checkbox" name="newsletter">
                        Please subscribe me to the monthly newsletter
                    </label>

                    <button type="submit">Get In Touch!</button>

                </form>
            </div>

        </section>

        <section class="employees">

            <h2>We Are Here to Serve You</h2>

            <figure>
                <img src="images/download (5).jpg" alt="Operations Manager">
                <figcaption>Sarah Johnson - Operations Manager</figcaption>
            </figure>

            <figure>

                <img src="images/download (4).jpg" alt="Lead River Guide">
                <figcaption>Loveth Okello - Lead River Guide</figcaption>
            </figure>

            <figure>
                <img src="images/images (3).jpg" alt="Reservations Manager">
                <figcaption>Grace Nankunda - Reservations Manager</figcaption>
            </figure>

        </section>


        </main>

        <footer>
            <p>© 2026 Nile River Explorers | Mary Akintade</p>

            <nav class="socialmedia">
                <a href="https://facebook.com">
                    <img src="images/facebook.png" alt="Facebook">
                </a>

                <a href="https://instagram.com">
                    <img src="images/instagram.jpg" alt="Instagram">
                </a>

                <a href="https://linkedin.com">
                    <img src="images/linkedin logo.png" alt="LinkedIn">
                </a>
            </nav>
        </footer>

</body>

</html>
